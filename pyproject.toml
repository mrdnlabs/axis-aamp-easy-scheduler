[project]
name = "aamp-easy-scheduler"
version = "0.1.0"
description = "Voice/NL-driven scheduling for AXIS Audio Manager Pro"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "mcp>=1.2",
    "httpx>=0.27",
    "google-genai>=2.5",
    "zeroconf>=0.131",
    "keyring>=24",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "rich>=13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aamp"]

[project.scripts]
aamp-mcp = "aamp.mcp_server:main"
aamp-describe = "aamp.cli:describe_main"
aamp-chat = "aamp.chat:main"
aamp-set-credential = "aamp.credentials_cli:set_main"
aamp-list-credentials = "aamp.credentials_cli:list_main"
aamp-delete-credential = "aamp.credentials_cli:delete_main"
aamp-migrate-credentials = "aamp.credentials_cli:migrate_main"
aamp-server = "aamp.server.app:main"
aamp-chat-send = "aamp.server.chat_test_client:main"
